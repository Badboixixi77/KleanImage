name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Provide stub env vars so build doesn't fail on missing values
          NEXT_PUBLIC_SITE_URL: https://kleanimage.com.ng
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: kleanimage.com.ng
          NEXT_PUBLIC_FEATURE_PAYSTACK: "false"
          SANITY_REVALIDATE_SECRET: placeholder
